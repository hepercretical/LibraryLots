[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "library-lots-backend"
version = "0.1.0"
description = "Local Python API and analysis service for Library Lots"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "lets-plot==4.6.2",
  "numpy==2.2.1",
  "polars==1.19.0",
  "python-dotenv==1.0.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "httpx==0.28.1",
  "pytest==8.3.4",
  "ruff==0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools.packages.find]
where = ["src"]

